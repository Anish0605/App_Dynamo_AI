<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dynamo AI — Paid Users Dashboard</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: "class" };
    document.documentElement.classList.add("dark");
  </script>
  <style>
    body { font-family: Inter, system-ui, sans-serif; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .fade-up { animation: fadeUp 0.35s ease forwards; }
    th { white-space: nowrap; }
    td { vertical-align: middle; }
  </style>
</head>
<body class="min-h-screen bg-[#0B0F19] text-white">

  <!-- Auth gate -->
  <div id="auth-gate" class="min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-sm bg-gray-900 border border-gray-800 rounded-2xl p-8 shadow-2xl fade-up">
      <div class="flex items-center gap-3 mb-8">
        <div class="w-9 h-9 bg-yellow-400 rounded-xl flex items-center justify-center shadow-lg">
          <svg viewBox="0 0 24 24" class="w-5 h-5 fill-black"><path d="M13 2L4.09 12.37A1 1 0 0 0 5 14h5.5l-1.5 8 8.91-10.37A1 1 0 0 0 17 10h-5.5L13 2z"/></svg>
        </div>
        <span class="text-lg font-bold tracking-tight">Dynamo AI</span>
        <span class="ml-auto text-xs font-bold bg-yellow-400/10 border border-yellow-400/30 text-yellow-400 px-2 py-0.5 rounded-full uppercase tracking-widest">Admin</span>
      </div>
      <h1 class="text-xl font-extrabold mb-1">Paid Users</h1>
      <p class="text-sm text-gray-400 mb-6">Enter your admin secret to view paid users &amp; invoices.</p>
      <label class="block text-xs font-semibold text-gray-400 mb-1.5 uppercase tracking-wide">Admin Secret</label>
      <input id="secret-input" type="password" placeholder="Enter admin secret…"
        class="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-xl text-sm text-white placeholder-gray-600 focus:outline-none focus:border-yellow-400 transition mb-3" />
      <div id="auth-error" class="hidden text-red-400 text-sm mb-3"></div>
      <button id="auth-btn" class="w-full py-3 bg-yellow-400 text-black font-bold rounded-xl hover:bg-yellow-300 transition text-sm">Access Dashboard →</button>
    </div>
  </div>

  <!-- Main dashboard -->
  <div id="dashboard" class="hidden min-h-screen">
    <header class="border-b border-gray-800/60 px-6 py-4 flex items-center gap-4">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 bg-yellow-400 rounded-lg flex items-center justify-center">
          <svg viewBox="0 0 24 24" class="w-4 h-4 fill-black"><path d="M13 2L4.09 12.37A1 1 0 0 0 5 14h5.5l-1.5 8 8.91-10.37A1 1 0 0 0 17 10h-5.5L13 2z"/></svg>
        </div>
        <span class="font-bold tracking-tight text-white">Dynamo AI</span>
        <span class="text-gray-600 text-sm">/</span>
        <span class="text-gray-300 text-sm font-medium">Paid Users</span>
      </div>
      <div class="ml-auto flex items-center gap-3">
        <button id="refresh-btn" class="text-sm text-gray-400 hover:text-white transition flex items-center gap-1.5">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
          Refresh
        </button>
        <span class="inline-flex items-center gap-1.5 text-xs font-semibold bg-yellow-400/10 text-yellow-400 border border-yellow-400/20 rounded-full px-2.5 py-1">
          <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          Admin
        </span>
        <button id="logout-btn" class="text-xs text-gray-500 hover:text-gray-300 transition">Sign out</button>
      </div>
    </header>

    <main class="px-6 py-6 max-w-7xl mx-auto space-y-6">
      <!-- Summary cards -->
      <div id="summary-cards" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4"></div>

      <!-- Toolbar -->
      <div class="flex flex-col md:flex-row md:items-center gap-3">
        <div class="relative flex-1 max-w-sm">
          <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="search-input" oninput="filterUsers()" placeholder="Search by name, email or plan…"
            class="w-full pl-9 pr-4 py-2 bg-gray-900 border border-gray-800 rounded-xl text-sm text-white placeholder-gray-600 focus:outline-none focus:border-yellow-400/50 transition" />
        </div>
        <div class="flex items-center gap-2" id="filter-buttons"></div>
        <div class="ml-auto">
          <button id="export-btn" class="text-sm bg-gray-800 hover:bg-gray-700 border border-gray-700 text-gray-200 px-3 py-1.5 rounded-lg transition flex items-center gap-1.5">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Export CSV
          </button>
        </div>
      </div>

      <!-- Loading -->
      <div id="loading" class="text-center py-20 text-gray-500">
        <svg class="w-8 h-8 mx-auto mb-3 animate-spin text-yellow-400" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"/></svg>
        Loading paid users…
      </div>

      <!-- Error -->
      <div id="error-state" class="hidden text-center py-20 text-red-400"></div>

      <!-- Table -->
      <div id="data-view" class="hidden fade-up bg-gray-900/60 border border-gray-800/60 rounded-2xl overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead><tr class="border-b border-gray-800/60 text-xs text-gray-500 uppercase tracking-widest">
              <th class="text-left px-5 py-3 font-semibold">Name</th>
              <th class="text-left px-5 py-3 font-semibold">Email</th>
              <th class="text-left px-5 py-3 font-semibold">Plan</th>
              <th class="text-left px-5 py-3 font-semibold">Conversion</th>
              <th class="text-left px-5 py-3 font-semibold">Amount</th>
              <th class="text-left px-5 py-3 font-semibold">Period</th>
              <th class="text-left px-5 py-3 font-semibold">Invoice #</th>
              <th class="text-left px-5 py-3 font-semibold">Status</th>
              <th class="text-right px-5 py-3 font-semibold">Actions</th>
            </tr></thead>
            <tbody id="users-tbody" class="divide-y divide-gray-800/40"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script>
    const BACKEND_URL = "";
    const STORAGE_KEY = "dynamo_admin_secret";
    let allUsers = [];
    let currentRows = [];
    let activeFilter = "all";

    // Auth
    const secretInput = document.getElementById("secret-input");
    const authBtn = document.getElementById("auth-btn");
    const authError = document.getElementById("auth-error");
    const authGate = document.getElementById("auth-gate");
    const dashboard = document.getElementById("dashboard");

    async function apiGet(path, secret) {
      const res = await fetch(`${BACKEND_URL}${path}`, { headers: { "X-Admin-Secret": secret } });
      if (res.status === 401 || res.status === 503) {
        const j = await res.json().catch(() => ({}));
        throw new Error(j.detail || "Invalid admin secret");
      }
      if (!res.ok) throw new Error(`Server error ${res.status}`);
      return res.json();
    }

    authBtn.addEventListener("click", async () => {
      const secret = secretInput.value.trim();
      if (!secret) { authError.textContent = "Please enter the admin secret."; authError.classList.remove("hidden"); return; }
      authBtn.textContent = "Verifying…"; authBtn.disabled = true;
      try {
        await apiGet("/admin/paid-users", secret);
        sessionStorage.setItem(STORAGE_KEY, secret);
        authGate.classList.add("hidden");
        dashboard.classList.remove("hidden");
        loadData(secret);
      } catch (e) {
        authError.textContent = e.message; authError.classList.remove("hidden");
        authBtn.textContent = "Access Dashboard →"; authBtn.disabled = false;
      }
    });
    secretInput.addEventListener("keydown", e => { if (e.key === "Enter") authBtn.click(); });

    const storedSecret = sessionStorage.getItem(STORAGE_KEY);
    if (storedSecret) { authGate.classList.add("hidden"); dashboard.classList.remove("hidden"); loadData(storedSecret); }

    document.getElementById("refresh-btn").addEventListener("click", () => {
      const s = sessionStorage.getItem(STORAGE_KEY); if (s) loadData(s);
    });
    document.getElementById("logout-btn").addEventListener("click", () => { sessionStorage.removeItem(STORAGE_KEY); location.reload(); });

    async function loadData(secret) {
      document.getElementById("loading").classList.remove("hidden");
      document.getElementById("error-state").classList.add("hidden");
      document.getElementById("data-view").classList.add("hidden");
      try {
        const data = await apiGet("/admin/paid-users", secret);
        allUsers = data.users || [];
        renderSummary(data.stats);
        renderFilters();
        filterUsers();
      } catch (e) {
        document.getElementById("loading").classList.add("hidden");
        document.getElementById("error-state").textContent = e.message;
        document.getElementById("error-state").classList.remove("hidden");
      }
    }

    function renderSummary(stats) {
      const mrrFormatted = stats.mrr ? `₹${stats.mrr.toLocaleString("en-IN")}` : "₹0";
      const revenueFormatted = stats.totalRevenue ? `₹${(stats.totalRevenue / 100).toLocaleString("en-IN")}` : "₹0";
      const cards = [
        { label: "Total Paid",    value: stats.total,    color: "text-white",       stroke: "text-gray-500",   svgEl: `<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>` },
        { label: "Active Subs",   value: stats.active,   color: "text-emerald-400", stroke: "text-emerald-500",svgEl: `<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/>` },
        { label: "Pro Users",     value: stats.proUsers, color: "text-purple-400",  stroke: "text-purple-500", svgEl: `<line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/>` },
        { label: "Plus Users",    value: stats.plusUsers,color: "text-yellow-400",  stroke: "text-yellow-500", svgEl: `<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>` },
        { label: "MRR",           value: mrrFormatted,   color: "text-emerald-400", stroke: "text-emerald-500",svgEl: `<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>` },
        { label: "Total Revenue", value: revenueFormatted,color:"text-white",        stroke: "text-gray-400",   svgEl: `<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>` },
      ];
      document.getElementById("summary-cards").innerHTML = cards.map(c => `
        <div class="bg-gray-900/60 border border-gray-800/60 rounded-2xl px-5 py-4 flex items-center gap-4">
          <div class="w-10 h-10 bg-gray-800 rounded-xl flex items-center justify-center shrink-0">
            <svg class="w-4 h-4 ${c.stroke}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${c.svgEl}</svg>
          </div>
          <div>
            <div class="text-xs font-semibold text-gray-500 uppercase tracking-widest mb-0.5">${c.label}</div>
            <div class="text-2xl font-extrabold ${c.color}">${c.value}</div>
          </div>
        </div>
      `).join("");
    }

    function renderFilters() {
      const filters = ["all", "active", "pro", "plus", "cancelled"];
      document.getElementById("filter-buttons").innerHTML = filters.map(f => `
        <button onclick="setFilter('${f}')"
          class="px-3 py-1.5 rounded-lg text-xs font-semibold transition border ${activeFilter === f ? 'bg-yellow-400/10 text-yellow-400 border-yellow-400/30' : 'bg-gray-900 text-gray-400 border-gray-800 hover:text-gray-300'}">
          ${f === "all" ? "All" : f.charAt(0).toUpperCase() + f.slice(1)}
        </button>
      `).join("");
    }

    window.setFilter = function(f) {
      activeFilter = f;
      renderFilters();
      filterUsers();
    };

    window.filterUsers = function() {
      const search = (document.getElementById("search-input")?.value || "").toLowerCase();
      let rows = allUsers.filter(u => {
        if (activeFilter === "active") return u.status === "active";
        if (activeFilter === "pro") return u.plan.toLowerCase().includes("pro");
        if (activeFilter === "plus") return u.plan.toLowerCase().includes("plus");
        if (activeFilter === "cancelled") return u.status === "cancelled";
        return true;
      }).filter(u =>
        (u.name || "").toLowerCase().includes(search) ||
        (u.email || "").toLowerCase().includes(search) ||
        (u.plan || "").toLowerCase().includes(search)
      );
      currentRows = rows;
      document.getElementById("loading").classList.add("hidden");
      document.getElementById("data-view").classList.remove("hidden");

      const tbody = document.getElementById("users-tbody");
      tbody.innerHTML = rows.map(u => {
        const planColor = u.plan.toLowerCase().includes("pro") ? "bg-purple-500/10 text-purple-300" : "bg-yellow-400/10 text-yellow-400";
        const statusCls = u.status === "active" ? "bg-emerald-500/10 text-emerald-400 border-emerald-500/20" : "bg-red-500/10 text-red-400 border-red-500/20";
        const statusIcon = u.status === "active" ? "M22 11.08V12a10 10 0 1 1-5.93-9.14 M22 4 12 14.01 9 11.01" : "M18 6 6 18 M6 6l12 12";
        const amountFormatted = u.amount ? `₹${(u.amount / 100).toLocaleString("en-IN")}` : "₹0";
        return `
          <tr class="hover:bg-gray-800/30 transition ${u.status === 'cancelled' ? 'opacity-60' : ''}">
            <td class="px-5 py-3 text-gray-200 font-medium text-xs">${esc(u.name)}</td>
            <td class="px-5 py-3 text-gray-300 font-mono text-xs">${esc(u.email)}</td>
            <td class="px-5 py-3"><span class="inline-flex items-center text-xs font-semibold px-2 py-0.5 rounded-full ${planColor}">${u.plan}</span></td>
            <td class="px-5 py-3">
              <div class="text-[10px] text-gray-400">${esc(u.source)}</div>
              <div class="text-[10px] text-gray-500 font-mono">${fmtDate(u.convertedAt)}</div>
            </td>
            <td class="px-5 py-3 text-gray-200 font-semibold text-xs">${amountFormatted}</td>
            <td class="px-5 py-3 text-gray-400 text-xs font-mono">${esc(u.period)}</td>
            <td class="px-5 py-3 text-gray-300 font-mono text-xs">${esc(u.invoiceId)}</td>
            <td class="px-5 py-3">
              <span class="inline-flex items-center gap-1 text-xs font-semibold px-2 py-0.5 rounded-full border ${statusCls}">
                <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${statusIcon}</svg>
                ${u.status.toUpperCase()}
              </span>
            </td>
            <td class="px-5 py-3 text-right">
              <div class="inline-flex items-center gap-2">
                <button class="inline-flex items-center gap-1 text-xs font-semibold bg-yellow-400/10 text-yellow-400 border border-yellow-400/20 px-3 py-1.5 rounded-lg hover:bg-yellow-400/20 transition">
                  <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg> Invoice
                </button>
                <button class="text-gray-500 hover:text-white transition">
                  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M17 7H7M17 7v10"/></svg>
                </button>
              </div>
            </td>
          </tr>
        `;
      }).join("") || `<tr><td colspan="9" class="text-center py-12 text-gray-500 text-sm">No paid users match your filters.</td></tr>`;
    };

    function esc(str) { return String(str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
    function fmtDate(dt) { if (!dt) return ""; try { const d = new Date(dt); return d.toLocaleString("en-IN", { dateStyle: "medium", timeStyle: "short" }); } catch { return dt.slice(0, 16); } }

    // CSV Export
    document.getElementById("export-btn").addEventListener("click", () => {
      if (!currentRows.length) return;
      const headers = ["Name", "Email", "Plan", "Source", "Amount (₹)", "Period", "Invoice ID", "Status", "Converted At"];
      const rows = [headers];
      currentRows.forEach(u => rows.push([
        u.name, u.email, u.plan, u.source, String(u.amount / 100), u.period, u.invoiceId, u.status, u.convertedAt
      ].map(v => `"${String(v).replace(/"/g, '""')}"`)));
      const csv = rows.map(r => r.join(",")).join("\n");
      const blob = new Blob([csv], { type: "text/csv" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = `paid-users-${new Date().toISOString().slice(0,10)}.csv`; a.click();
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
